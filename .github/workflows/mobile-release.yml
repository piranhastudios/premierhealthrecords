name: Mobile Release

# Builds and (optionally) ships the Expo patient-portal app via EAS.
#
# Two ways in:
#   * Manual   — Actions -> Mobile Release -> Run workflow. Pick the profile.
#   * Tag      — push a tag like `portal-v0.2.0` to build the production profile.
#
# Profiles come from examples/patient-portal/eas.json:
#   development / preview -> Android APK, internal distribution (what testers install)
#   production            -> Android AAB, Play Store distribution
#
# Required repository secret:
#   EXPO_TOKEN            EAS robot access token (expo.dev -> Account -> Access tokens)
# Optional:
#   SENTRY_DSN            turns crash reporting on for the build
#   SENTRY_AUTH_TOKEN     uploads source maps so stack traces are readable
#   SENTRY_ORG / SENTRY_PROJECT
#
# Play Store submission is OFF unless you tick `submit`. It needs the Google
# service-account JSON registered with EAS (`eas credentials`) and, for the very
# first release, a manual upload — Google rejects API submissions to a track
# that has never had a build.

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        default: preview
        options: [preview, development, production]
      platform:
        description: 'Target platform'
        type: choice
        default: android
        options: [android, ios, all]
      submit:
        description: 'Submit to the store after building (production only)'
        type: boolean
        default: false
  push:
    tags:
      - 'portal-v*'

permissions:
  contents: read

jobs:
  build:
    name: EAS build (${{ github.event_name == 'push' && 'production' || inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A tag push is always a production build; a manual run uses the chosen profile.
      PROFILE: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
      PLATFORM: ${{ github.event_name == 'push' && 'android' || inputs.platform }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Require EXPO_TOKEN
        # Fail loudly and early: without this, eas-cli drops into an interactive
        # login prompt and the job hangs until it times out.
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a robot token at https://expo.dev and add it to repository secrets."
            exit 1
          fi

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Build workspace dependencies
        # EAS also runs this via `eas-build-post-install`, but the local copy has
        # to exist for `expo config` / fingerprinting to resolve @medplum/*.
        run: npx turbo run build --filter=@medplum/core --filter=@medplum/react-hooks

      - name: EAS build
        working-directory: examples/patient-portal
        run: |
          eas build \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json > build-result.json
          cat build-result.json

      - name: Publish artifact links
        if: always()
        working-directory: examples/patient-portal
        run: |
          test -f build-result.json || exit 0
          node -e '
            const builds = require("./build-result.json");
            const rows = (Array.isArray(builds) ? builds : [builds]).map(
              (b) =>
                `| ${b.platform} | ${b.buildProfile} | ${b.appVersion}+${b.appBuildVersion} | ${b.status} | ${
                  b.artifacts?.applicationArchiveUrl ?? "n/a"
                } |`
            );
            console.log("| Platform | Profile | Version | Status | Artifact |");
            console.log("| --- | --- | --- | --- | --- |");
            console.log(rows.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to store
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit && inputs.profile == 'production' }}
        working-directory: examples/patient-portal
        run: |
          eas submit \
            --platform "$PLATFORM" \
            --profile production \
            --latest \
            --non-interactive
