# BookStack knowledge base — staff wiki (SOPs, training, per-location shelves).
#
# This is the reference copy of the stack deployed by hand at
# /opt/storefactory/stores/premier-health-docs on the Hetzner box, alongside the
# Medplum stack. Secrets and hostnames come from the .env file next to it there
# (DOCS_HOST, BOOKSTACK_DB_PASSWORD, BOOKSTACK_APP_KEY, BOOKSTACK_OIDC_*).
#
# AUTH_METHOD is `standard` (email + password), NOT `oidc`: BookStack only
# accepts RS256-signed tokens and this Medplum signs ES256, so SSO cannot work
# until that is resolved. Runbook: docs/knowledge-base.md.
services:
  bookstack-db:
    image: mariadb:11
    container_name: phr-docs-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack-db-data:/var/lib/mysql
    networks: [docs]
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: phr-docs
    restart: unless-stopped
    depends_on:
      bookstack-db: { condition: service_healthy }
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: 'Africa/Douala'
      APP_URL: 'https://${DOCS_HOST}'
      APP_KEY: '${BOOKSTACK_APP_KEY}'
      DB_HOST: 'bookstack-db'
      DB_PORT: '3306'
      DB_USERNAME: 'bookstack'
      DB_PASSWORD: '${BOOKSTACK_DB_PASSWORD}'
      DB_DATABASE: 'bookstack'
      # Held at `standard` by the RS256/ES256 mismatch above. When SSO does
      # become possible, BookStack matches logins to existing users BY EMAIL,
      # so accounts keep their roles as long as the emails match.
      AUTH_METHOD: '${BOOKSTACK_AUTH_METHOD}'
      AUTH_AUTO_INITIATE: 'false'
      OIDC_NAME: 'Premier Health'
      OIDC_DISPLAY_NAME_CLAIMS: 'name'
      OIDC_CLIENT_ID: '${BOOKSTACK_OIDC_CLIENT_ID}'
      OIDC_CLIENT_SECRET: '${BOOKSTACK_OIDC_CLIENT_SECRET}'
      # Must byte-match the issuer in /api/.well-known/openid-configuration.
      OIDC_ISSUER: 'https://app.premierhealthcentres.com/api/'
      OIDC_ISSUER_DISCOVER: 'true'
      OIDC_USER_TO_GROUPS: 'false'
    volumes:
      - bookstack-data:/config
    networks: [docs, proxy]
    expose: ['80']
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://127.0.0.1:80/status || wget -qO- http://127.0.0.1:80/status']
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.phr-docs.rule=Host(`${DOCS_HOST}`)
      - traefik.http.routers.phr-docs.entrypoints=websecure
      - traefik.http.routers.phr-docs.tls.certresolver=le
      - traefik.http.services.phr-docs.loadbalancer.server.port=80

volumes:
  bookstack-db-data:
  bookstack-data:

networks:
  docs:
  proxy:
    external: true
