services:
  postgres:
    image: postgres:16
    restart: unless-stopped # for production usage, consider using 'always'
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    command:
      # We use command line args instead of a postgres.conf to avoid additional setup out of the box
      - 'postgres'
      - '-c'
      - 'listen_addresses=*'
      - '-c'
      - 'statement_timeout=60000'
      - '-c'
      - 'default_transaction_isolation=REPEATABLE READ'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements,auto_explain'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped # for production usage, consider 'always'
    command: redis-server --requirepass medplum
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'medplum', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # TURN/STUN server for telemedicine (WebRTC). Relays media when peers cannot
  # connect directly (NAT/firewall). Set TURN_SECRET and the realm for production,
  # and point the provider app at it via VITE_TURN_URL / VITE_TURN_USERNAME /
  # VITE_TURN_CREDENTIAL.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host # coturn needs the host network for the RTP relay port range
    command:
      - '-n'
      - '--listening-port=3478'
      - '--fingerprint'
      - '--lt-cred-mech'
      - '--realm=premierhealth'
      - '--user=telehealth:${TURN_SECRET:-changeme}'
      - '--min-port=49160'
      - '--max-port=49200'

  # Medplum server container
  medplum-server:
    # Build the server from this fork so the Premier Health backend (pawaPay $pay,
    # /payments callback, Vertex AI, telehealth signaling) is included. Replaces the
    # upstream medplum/medplum-server:latest image.
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8103:8103'
    command: ['env']
    environment:
      MEDPLUM_PORT: 8103
      # Public HTTPS URLs. The API is reached same-origin under /api on the provider
      # domain (Traefik strips the /api prefix → medplum-server). Serving these over
      # https avoids mixed-content blocking when the HTTPS provider UI calls the API.
      MEDPLUM_BASE_URL: 'https://app.premierhealthcentres.com/api/'
      MEDPLUM_APP_BASE_URL: 'https://app.premierhealthcentres.com/'
      MEDPLUM_STORAGE_BASE_URL: 'https://app.premierhealthcentres.com/api/storage/'

      MEDPLUM_DATABASE_HOST: 'postgres'
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: 'medplum'
      MEDPLUM_DATABASE_USERNAME: 'medplum'
      MEDPLUM_DATABASE_PASSWORD: 'medplum'

      MEDPLUM_REDIS_HOST: 'redis'
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: 'medplum'

      MEDPLUM_BINARY_STORAGE: 'file:./binary/'
      MEDPLUM_SUPPORT_EMAIL: '\"Medplum\" <support@medplum.com>'
      MEDPLUM_GOOGLE_CLIENT_ID: '397236612778-c0b5tnjv98frbo1tfuuha5vkme3cmq4s.apps.googleusercontent.com'
      MEDPLUM_GOOGLE_CLIENT_SECRET: ''
      # reCAPTCHA disabled: the previous values were Medplum's stock demo keys, bound to
      # medplum.com domains — they could never validate a token from app.premierhealthcentres.com,
      # so registration was blocked for everyone. Empty secret => server skips reCAPTCHA
      # (see validateRecaptcha in packages/server/src/auth/utils.ts), enabling in-app patient
      # self sign-up. Re-add a domain-matched key pair here if bot protection is needed later.
      MEDPLUM_RECAPTCHA_SITE_KEY: ''
      MEDPLUM_RECAPTCHA_SECRET_KEY: ''
      MEDPLUM_MAX_JSON_SIZE: '1mb'
      MEDPLUM_MAX_BATCH_SIZE: '50mb'
      MEDPLUM_BOT_LAMBDA_ROLE_ARN: ''
      MEDPLUM_BOT_LAMBDA_LAYER_NAME: 'medplum-bot-layer'
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: 'true'
      MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: 'vmcontext'
      MEDPLUM_ALLOWED_ORIGINS: '*'
      MEDPLUM_INTROSPECTION_ENABLED: 'true'
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: 30000

      # pawaPay (mobile money). Token comes from the Coolify env store, not git.
      # Use the sandbox host for the sandbox token; switch to https://api.pawapay.io for production.
      PAWAPAY_BASE_URL: 'https://api.sandbox.pawapay.io'
      PAWAPAY_API_TOKEN: '${PAWAPAY_API_TOKEN}'

    healthcheck:
      test:
        # We use Node's fetch for healthcheck because this image doesn't have a curl or wget installed
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      # Image exposes both 5000 and 8103; force Traefik to use 8103 for the auto-generated service.
      # UUID is hard-coded because Coolify v4.0.0 does not expand ${COOLIFY_RESOURCE_UUID} in labels;
      # it must match the router name Coolify generates: http-0-<app-uuid>-medplum-server.
      - traefik.http.services.http-0-lb8d6788oexaznj9u39kmky8-medplum-server.loadbalancer.server.port=8103

  # Medplum app container (admin web UI)
  medplum-app:
    # Build from the monorepo workspace so local @medplum/* customizations (Premier
    # Health branding in packages/react + packages/app static/index.html) are baked
    # in and a push to main rebuilds the admin app. See Dockerfile.app. The image
    # entrypoint sed-replaces build-time config tokens from the env below at startup.
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    environment:
      # Entrypoint replaces the build-time __MEDPLUM_BASE_URL__ token with this.
      MEDPLUM_BASE_URL: 'https://app.premierhealthcentres.com/api/'
    ports:
      - '3000:3000'
    healthcheck:
      # nginx-unprivileged:alpine ships busybox wget, not curl.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Force Traefik to use port 3000 for the auto-generated service.
      # UUID hard-coded (Coolify v4.0.0 does not expand ${COOLIFY_RESOURCE_UUID} in labels).
      - traefik.http.services.http-0-lb8d6788oexaznj9u39kmky8-medplum-app.loadbalancer.server.port=3000

  # Medplum Provider app (provider-facing EHR UI)
  medplum-provider:
    # Build from the monorepo workspace so local @medplum/* customizations
    # (Premier Health branding in packages/react, telehealth UI) are baked in and
    # a push to main rebuilds the provider. See Dockerfile.provider.
    build:
      context: .
      dockerfile: Dockerfile.provider
      args:
        VITE_MEDPLUM_BASE_URL: 'https://app.premierhealthcentres.com/api/'
        VITE_TURN_URL: '${VITE_TURN_URL:-}'
        VITE_TURN_USERNAME: '${VITE_TURN_USERNAME:-telehealth}'
        VITE_TURN_CREDENTIAL: '${VITE_TURN_CREDENTIAL:-}'
    restart: unless-stopped
    depends_on:
      medplum-server:
        condition: service_healthy
    ports:
      - '3001:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Bind Traefik's auto-generated router to the nginx port (80).
      # UUID hard-coded (Coolify v4.0.0 does not expand ${COOLIFY_RESOURCE_UUID} in labels).
      - traefik.http.services.http-0-lb8d6788oexaznj9u39kmky8-medplum-provider.loadbalancer.server.port=80

  # ---------------------------------------------------------------------------
  # Cal.diy — public booking widget for the marketing website
  # (examples/medplum-demo-bots/src/premierhealth/CALDIY.md is the runbook).
  #
  # Medplum stays the system of record: the caldiy-webhook bot turns Cal.diy
  # bookings into FHIR Appointments and the caldiy-mirror bot pushes portal /
  # provider bookings back into Cal.diy through API v2 (the `caldiy-api` service,
  # reached only inside the compose network). Cal.diy has NO SMTP configured on
  # purpose: every patient message goes through Medplum's WhatsApp/email dispatcher.
  #
  # Own Postgres so Cal.diy can be removed without touching Medplum data. All
  # secrets come from the Coolify env store (set them BEFORE this file deploys):
  #   CALDIY_DB_PASSWORD, CALDIY_NEXTAUTH_SECRET (openssl rand -base64 32),
  #   CALDIY_ENCRYPTION_KEY (openssl rand -base64 24), CALDIY_JWT_SECRET,
  #   CALDIY_PUBLIC_URL (default https://book.premierhealthcentrescameroon.com).
  # ---------------------------------------------------------------------------
  cal-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=calcom
      - POSTGRES_PASSWORD=${CALDIY_DB_PASSWORD:-calcom}
      - POSTGRES_DB=calcom
    volumes:
      - caldiy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calcom -d calcom']
      interval: 10s
      timeout: 5s
      retries: 5

  caldiy:
    # Pinned: Cal.diy is community-maintained; upgrade deliberately.
    image: calcom/cal.diy:v6.2.0
    restart: unless-stopped
    depends_on:
      cal-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://calcom:${CALDIY_DB_PASSWORD:-calcom}@cal-postgres:5432/calcom'
      DATABASE_DIRECT_URL: 'postgresql://calcom:${CALDIY_DB_PASSWORD:-calcom}@cal-postgres:5432/calcom'
      # The image was built with a placeholder NEXT_PUBLIC_WEBAPP_URL that its
      # start script rewrites from this value at boot (calcom/docker convention).
      # If the booking page renders with localhost links, the image lacks that
      # script: build from source with the URL as a build arg instead.
      NEXT_PUBLIC_WEBAPP_URL: '${CALDIY_PUBLIC_URL:-https://book.premierhealthcentrescameroon.com}'
      NEXTAUTH_URL: '${CALDIY_PUBLIC_URL:-https://book.premierhealthcentrescameroon.com}'
      NEXTAUTH_SECRET: '${CALDIY_NEXTAUTH_SECRET:?set CALDIY_NEXTAUTH_SECRET}'
      CALENDSO_ENCRYPTION_KEY: '${CALDIY_ENCRYPTION_KEY:?set CALDIY_ENCRYPTION_KEY}'
      # Flip to 1 once the admin and practitioner users exist (see CALDIY.md).
      NEXT_PUBLIC_DISABLE_SIGNUP: '${CALDIY_DISABLE_SIGNUP:-0}'
      NEXT_PUBLIC_LICENSE_CONSENT: 'agree'
      NEXT_PUBLIC_TELEMETRY_KEY: ''
      TZ: 'Africa/Douala'
      # Behind Coolify's TLS-terminating proxy.
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      # No EMAIL_SERVER_* on purpose — Medplum sends every patient message.
    ports:
      - '3002:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/auth/login']
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      # UUID hard-coded like the other services (Coolify v4.0.0 does not expand
      # ${COOLIFY_RESOURCE_UUID}); map the router for book.* to this port.
      - traefik.http.services.http-0-lb8d6788oexaznj9u39kmky8-caldiy.loadbalancer.server.port=3000

  caldiy-api:
    # Cal.diy API v2 (NestJS) is not part of the web image; build it from the
    # same tag. Only the Medplum bots talk to it (http://caldiy-api:5555), so it
    # is not exposed through Traefik.
    build:
      context: 'https://github.com/calcom/cal.diy.git#v6.2.0'
      dockerfile: apps/api/v2/Dockerfile
    restart: unless-stopped
    depends_on:
      cal-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: 'production'
      API_PORT: 5555
      DATABASE_READ_URL: 'postgresql://calcom:${CALDIY_DB_PASSWORD:-calcom}@cal-postgres:5432/calcom'
      DATABASE_WRITE_URL: 'postgresql://calcom:${CALDIY_DB_PASSWORD:-calcom}@cal-postgres:5432/calcom'
      NEXTAUTH_SECRET: '${CALDIY_NEXTAUTH_SECRET:?set CALDIY_NEXTAUTH_SECRET}'
      CALENDSO_ENCRYPTION_KEY: '${CALDIY_ENCRYPTION_KEY:?set CALDIY_ENCRYPTION_KEY}'
      JWT_SECRET: '${CALDIY_JWT_SECRET:?set CALDIY_JWT_SECRET}'
      REDIS_URL: 'redis://:medplum@redis:6379/2'
      WEB_APP_URL: '${CALDIY_PUBLIC_URL:-https://book.premierhealthcentrescameroon.com}'
      API_URL: 'http://caldiy-api'
      API_KEY_PREFIX: 'cal_'
      LOG_LEVEL: '1'
      TZ: 'Africa/Douala'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5555/health || curl -fs http://127.0.0.1:5555/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

  # One-shot: load Premier Health reference data (terminology, insurers, care
  # templates) once the server is healthy. Idempotent — re-runs safely on each
  # deploy. Override the admin login with SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD.
  seed:
    image: node:24-bookworm-slim
    restart: 'no'
    depends_on:
      medplum-server:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
    command:
      - node
      - scripts/seed-cameroon.mjs
      - '--base'
      - 'http://medplum-server:8103'
      - '--email'
      - '${SEED_ADMIN_EMAIL:-admin@example.com}'
      - '--password'
      - '${SEED_ADMIN_PASSWORD:-medplum_admin}'

volumes:
  medplum-postgres-data:
  caldiy-postgres-data:
