# Local full-stack for development on Colima/Docker Desktop.
# Builds the server from this fork (Dockerfile.server) and the provider EHR, all
# pointed at localhost. pawaPay runs against the sandbox; the token comes from .env.
#
#   docker-compose -f docker-compose.local.yml up -d --build
#
# Provider EHR:  http://localhost:3000
# FHIR API:      http://localhost:8103
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medplum
      - POSTGRES_PASSWORD=medplum
      - POSTGRES_DB=medplum
    volumes:
      - phr-postgres:/var/lib/postgresql/data
    command: ['postgres', '-c', 'listen_addresses=*']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass medplum
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'medplum', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  medplum-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8103:8103'
    command: ['env']
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: 'http://localhost:8103/'
      MEDPLUM_APP_BASE_URL: 'http://localhost:3000/'
      MEDPLUM_STORAGE_BASE_URL: 'http://localhost:8103/storage/'
      MEDPLUM_DATABASE_HOST: 'postgres'
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: 'medplum'
      MEDPLUM_DATABASE_USERNAME: 'medplum'
      MEDPLUM_DATABASE_PASSWORD: 'medplum'
      MEDPLUM_REDIS_HOST: 'redis'
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: 'medplum'
      MEDPLUM_BINARY_STORAGE: 'file:./binary/'
      MEDPLUM_ALLOWED_ORIGINS: '*'
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: 'true'
      MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: 'vmcontext'
      MEDPLUM_INTROSPECTION_ENABLED: 'true'
      # pawaPay (sandbox). Token from .env.
      PAWAPAY_BASE_URL: 'https://api.sandbox.pawapay.io'
      PAWAPAY_API_TOKEN: '${PAWAPAY_API_TOKEN}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => process.exit(1))',
        ]
      interval: 10s
      timeout: 10s
      retries: 20

  medplum-provider:
    build:
      context: examples/medplum-provider
      dockerfile: Dockerfile
      args:
        VITE_MEDPLUM_BASE_URL: 'http://localhost:8103/'
    restart: unless-stopped
    depends_on:
      - medplum-server
    ports:
      - '3000:80'

volumes:
  phr-postgres:
